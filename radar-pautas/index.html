<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radar de Pautas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg:#12141c; --surface:#191c26; --surface-2:#20232f; --border:#2b2f3d;
    --text:#eae6da; --text-dim:#8f8c80; --accent:#e8a33d; --accent-2:#d6544f; --accent-3:#4f9d8f;
    --font-display:'Fraunces', serif; --font-body:'IBM Plex Sans', sans-serif; --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body); line-height:1.5; }
  a{ color:var(--accent); }

  .ticker-wrap{ background:var(--accent); color:#141212; overflow:hidden; white-space:nowrap; border-bottom:1px solid var(--border); font-family:var(--font-mono); font-size:12.5px; }
  .ticker{ display:inline-block; padding:6px 0; animation:tick 34s linear infinite; }
  .ticker span{ margin:0 28px; }
  @keyframes tick{ from{transform:translateX(0);} to{transform:translateX(-50%);} }
  @media (prefers-reduced-motion: reduce){ .ticker{animation:none;} }

  header.masthead{ padding:38px 28px 22px; max-width:920px; margin:0 auto; border-bottom:1px solid var(--border); }
  .eyebrow{ font-family:var(--font-mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--text-dim); margin-bottom:10px; }
  h1{ font-family:var(--font-display); font-weight:600; font-size:clamp(26px,4vw,40px); margin:0 0 8px; letter-spacing:-.01em; }
  .subtitulo{ color:var(--text-dim); font-size:15px; max-width:620px; }

  main{ max-width:920px; margin:0 auto; padding:26px 28px 80px; }

  .kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:1px; background:var(--border); border:1px solid var(--border); margin-bottom:26px; }
  .kpi{ background:var(--surface); padding:16px 18px; }
  .kpi .num{ font-family:var(--font-display); font-size:26px; color:var(--accent); }
  .kpi .lbl{ font-size:11.5px; color:var(--text-dim); margin-top:4px; }

  .controls{ display:flex; gap:10px; margin-bottom:22px; }
  .controls input[type="search"]{ flex:1; background:var(--surface-2); border:1px solid var(--border); color:var(--text); padding:9px 12px; font-family:var(--font-body); font-size:14px; }

  .grupo-data{ font-family:var(--font-mono); font-size:12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.08em; margin:26px 0 10px; }

  .card{ background:var(--surface); border:1px solid var(--border); padding:18px 20px; margin-bottom:14px; }
  .card h3{ font-family:var(--font-display); font-size:19px; margin:0 0 6px; font-weight:600; }
  .card .fonte-linha{ font-family:var(--font-mono); font-size:11.5px; color:var(--text-dim); margin-bottom:12px; }
  .card .fonte-linha a{ color:var(--text-dim); }
  .card p{ margin:0 0 10px; font-size:14.5px; }
  .rotulo{ font-family:var(--font-mono); font-size:11px; color:var(--accent-3); text-transform:uppercase; letter-spacing:.05em; margin-bottom:3px; }
  .gancho-box{ background:var(--surface-2); border:1px solid var(--border); padding:12px 14px; font-size:14px; margin-top:4px; }
  .card-rodape{ display:flex; align-items:center; gap:10px; margin-top:14px; flex-wrap:wrap; }
  .pontuacao{ font-family:var(--font-mono); font-size:12px; color:var(--accent); border:1px solid var(--border); padding:3px 8px; }
  .botao{ font-family:var(--font-mono); font-size:12px; background:var(--surface-2); border:1px solid var(--border); color:var(--text); padding:7px 12px; cursor:pointer; text-decoration:none; }
  .botao:hover{ border-color:var(--accent); color:var(--accent); }

  .vazio{ color:var(--text-dim); font-size:14px; padding:30px; text-align:center; border:1px dashed var(--border); }
  footer{ max-width:920px; margin:0 auto; padding:20px 28px 60px; color:var(--text-dim); font-size:12px; font-family:var(--font-mono); border-top:1px solid var(--border); }
</style>
</head>
<body>

<div class="ticker-wrap"><div class="ticker" id="ticker"></div></div>

<header class="masthead">
  <div class="eyebrow">curadoria diária por IA</div>
  <h1 id="titulo-pagina">Radar de Pautas</h1>
  <p class="subtitulo" id="subtitulo-pagina">Carregando…</p>
</header>

<main>
  <div class="kpis" id="kpis"></div>
  <div class="controls">
    <input type="search" id="busca" placeholder="buscar por palavra…">
  </div>
  <div id="lista"></div>
</main>

<footer>
  itens brutos via Google News RSS · seleção e redação dos ganchos por IA · atualização automática por GitHub Actions
</footer>

<script>
let CONFIG = null;
let GANCHOS = [];

async function iniciar(){
  const [config, csvTexto] = await Promise.all([
    fetch('config.json').then(r => r.json()),
    fetch('data/ganchos.csv').then(r => r.text())
  ]);
  CONFIG = config;
  document.getElementById('titulo-pagina').textContent = config.titulo || 'Radar de Pautas';
  document.getElementById('subtitulo-pagina').textContent = config.subtitulo || '';
  document.title = config.titulo || 'Radar de Pautas';

  const resultado = Papa.parse(csvTexto, { header:true, skipEmptyLines:true });
  GANCHOS = resultado.data.sort((a,b) => new Date(b.data_curadoria) - new Date(a.data_curadoria));

  render();
  document.getElementById('busca').addEventListener('input', render);
}

function render(){
  const termo = document.getElementById('busca').value.toLowerCase();
  const filtrados = GANCHOS.filter(g =>
    !termo || (g.titulo_pt + ' ' + g.resumo).toLowerCase().includes(termo)
  );

  renderTicker(filtrados);
  renderKpis(filtrados);
  renderLista(filtrados);
}

function renderTicker(dados){
  const total = GANCHOS.length;
  const hoje = contarHoje(GANCHOS);
  const media = mediaPontuacao(GANCHOS);
  const itens = [
    `${total} ganchos no histórico`,
    `${hoje} novo(s) hoje`,
    `pontuação média ${media}`,
    'atualizado automaticamente todo dia'
  ];
  const html = itens.map(t => `<span>${t}</span>`).join('');
  document.getElementById('ticker').innerHTML = html + html;
}

function contarHoje(dados){
  const hoje = new Date().toISOString().slice(0,10);
  return dados.filter(g => (g.data_curadoria || '').slice(0,10) === hoje).length;
}

function mediaPontuacao(dados){
  const valores = dados.map(g => parseFloat(g.pontuacao)).filter(v => !isNaN(v));
  if (!valores.length) return '—';
  return (valores.reduce((a,b) => a+b, 0) / valores.length).toFixed(1);
}

function renderKpis(dados){
  const cartoes = [
    { num: GANCHOS.length, lbl: 'ganchos no histórico' },
    { num: contarHoje(GANCHOS), lbl: 'novos hoje' },
    { num: mediaPontuacao(GANCHOS), lbl: 'pontuação média' },
    { num: dados.length, lbl: 'exibidos com o filtro atual' }
  ];
  document.getElementById('kpis').innerHTML = cartoes.map(c =>
    `<div class="kpi"><div class="num">${c.num}</div><div class="lbl">${c.lbl}</div></div>`
  ).join('');
}

function renderLista(dados){
  const container = document.getElementById('lista');
  if (!dados.length){
    container.innerHTML = '<div class="vazio">nenhum gancho encontrado</div>';
    return;
  }

  let ultimaData = null;
  let html = '';
  dados.forEach((g, i) => {
    const data = (g.data_curadoria || '').slice(0,10);
    if (data !== ultimaData){
      const dataFmt = data ? new Date(data).toLocaleDateString('pt-BR', { day:'2-digit', month:'long', year:'numeric' }) : 'sem data';
      html += `<div class="grupo-data">${dataFmt}</div>`;
      ultimaData = data;
    }
    const assunto = encodeURIComponent(`Sugestão de pauta: ${g.titulo_pt}`);
    const corpo = encodeURIComponent(`${g.gancho_pauta}\n\nFonte original: ${g.link}`);
    html += `
    <div class="card">
      <h3>${g.titulo_pt}</h3>
      <div class="fonte-linha"><a href="${g.link}" target="_blank" rel="noopener">${g.fonte}</a></div>
      <p>${g.resumo}</p>
      <div class="rotulo">por que é curioso</div>
      <p>${g.porque_curioso}</p>
      <div class="rotulo">gancho de pauta</div>
      <div class="gancho-box" id="gancho-${i}">${g.gancho_pauta}</div>
      <div class="card-rodape">
        <span class="pontuacao">pontuação ${g.pontuacao}</span>
        <button class="botao" onclick="copiar(${i}, this)">copiar gancho</button>
        <a class="botao" href="mailto:?subject=${assunto}&body=${corpo}">enviar por e-mail</a>
      </div>
    </div>`;
  });
  container.innerHTML = html;
}

function copiar(i, botao){
  const texto = document.getElementById('gancho-' + i).textContent;
  navigator.clipboard.writeText(texto).then(() => {
    const original = botao.textContent;
    botao.textContent = 'copiado!';
    setTimeout(() => { botao.textContent = original; }, 1500);
  });
}

iniciar();
</script>
</body>
</html>
